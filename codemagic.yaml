workflows:

  # ── Android release (.aab → Google Play) ────────────────────────────────────
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - android_credentials        # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.attasbih.app"
        CM_KEYSTORE_PATH: /tmp/keystore.jks

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Decode keystore
        script: echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH

      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Build Next.js (Capacitor static export)
        script: npm run build:cap    # BUILD_TARGET=capacitor → output: "export" → out/

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    # publishing to Google Play disabled until API access is configured
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  # ── iOS release (.ipa → TestFlight) ─────────────────────────────────────────
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - app-store
        - ios_credentials
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Build Next.js (Capacitor static export)
        script: npm run build:cap

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          KEYCHAIN_PWD="build_keychain_password"
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "=== Signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Profile UUID: $UUID"
          export PROFILE_UUID="$UUID"
          python3 -c 'import os,re; u=os.environ["PROFILE_UUID"]; p="ios/App/App.xcodeproj/project.pbxproj"; c=open(p).read(); s="PROVISIONING_PROFILE_SPECIFIER = "+chr(34)+u+chr(34)+";"; c=re.sub(r"PROVISIONING_PROFILE_SPECIFIER = [^;]+;",s,c) if "PROVISIONING_PROFILE_SPECIFIER" in c else c.replace("PRODUCT_BUNDLE_IDENTIFIER = com.attasbih.app;","PRODUCT_BUNDLE_IDENTIFIER = com.attasbih.app;\n\t\t\t\t"+s); open(p,"w").write(c); print("Injected UUID:",u)'

      - name: Set version from package.json
        script: |
          VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          UUID=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/" | grep ".mobileprovision" | head -1 | sed 's/.mobileprovision//')
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO
          python3 -c "import plistlib; f=open('/tmp/ExportOptions.plist','wb'); plistlib.dump({'method':'app-store','teamID':'XL3998UC87','signingStyle':'manual','provisioningProfiles':{'com.attasbih.app':'$UUID'}},f); f.close()"
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
