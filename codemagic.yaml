workflows:

  # ── Android release (.aab → Google Play) ────────────────────────────────────
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - android_credentials        # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.attasbih.app"
        CM_KEYSTORE_PATH: /tmp/keystore.jks

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Decode keystore
        script: echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH

      - name: Install dependencies
        script: npm ci

      - name: Build Next.js (Capacitor static export)
        script: npm run build:cap    # BUILD_TARGET=capacitor → output: "export" → out/

      - name: Sync Capacitor
        script: npx cap sync android --no-open

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    # publishing to Google Play disabled until API access is configured
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  # ── iOS release (.ipa → TestFlight) ─────────────────────────────────────────
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - app-store
      node: 22.x
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.attasbih.app

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build Next.js (Capacitor static export)
        script: npm run build:cap

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set version from package.json
        script: |
          VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
